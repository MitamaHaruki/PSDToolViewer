name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build PSDToolViewer.slnx -c Release

      - name: Test
        run: dotnet test tests/PSDToolViewer.Core.Tests/PSDToolViewer.Core.Tests.csproj -c Release --no-build
