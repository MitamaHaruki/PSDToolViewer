name: Release

# v1.2.3 のようなタグを push すると、インストーラー（MSI）とポータブル版を作って GitHub Releases に公開する。
# アプリの自動更新は、ここで公開した MSI（PSDToolViewer-<版>-win-<x64|arm64>.msi）を取得して上書きインストールする
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/PSDToolViewer.Core.Tests/PSDToolViewer.Core.Tests.csproj -c Release

      - name: Build installers
        shell: pwsh
        run: ./installer/build.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Publish to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -like "PSDToolViewer-$version-*" } | ForEach-Object FullName
          $notes = @"
          ## ダウンロード

          | ファイル | 内容 |
          |---|---|
          | PSDToolViewer-$version-win-x64.msi | インストーラー（Intel・AMD などの x64 端末） |
          | PSDToolViewer-$version-win-arm64.msi | インストーラー（Snapdragon などの ARM 端末） |
          | PSDToolViewer-$version-win-x64-portable.zip | ポータブル版（展開して PSDToolViewer.exe を実行） |
          | PSDToolViewer-$version-win-arm64-portable.zip | ポータブル版（ARM 端末） |

          インストール版は起動時に新しいバージョンを確認し、更新できます。
          "@
          gh release create '${{ github.ref_name }}' $files --title "PSDTool Viewer $version" --notes $notes
