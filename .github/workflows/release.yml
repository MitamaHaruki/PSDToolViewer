name: Release

# v1.2.3 のようなタグを push すると、ビルドして GitHub Releases に公開する（自動更新の配信元）
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/PSDToolViewer.Core.Tests/PSDToolViewer.Core.Tests.csproj -c Release

      - name: Publish
        run: >
          dotnet publish src/PSDToolViewer/PSDToolViewer.csproj -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.version }} -o publish

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      # 差分更新パッケージを作るため、前回のリリースを取得する（初回はないので失敗してよい）
      - name: Download previous release
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack
        run: >
          vpk pack --packId PSDToolViewer --packVersion ${{ steps.version.outputs.version }}
          --packDir publish --mainExe PSDToolViewer.exe
          --packTitle "PSDTool Viewer" --packAuthors MitamaHaruki
          --icon src/PSDToolViewer/Assets/AppIcon.ico

      - name: Upload to GitHub Releases
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }} --publish
          --releaseName "PSDTool Viewer ${{ steps.version.outputs.version }}"
          --tag ${{ github.ref_name }}
